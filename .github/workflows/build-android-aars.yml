name: Build and Publish Android AARs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version (e.g. 0.8.0-v.3). Empty = 0.8.0-v.<run_number>"
        required: false
        type: string
      group_id:
        description: "Maven groupId"
        required: false
        type: string
        default: com.metacrafters
      publish:
        description: "Publish to the maven-repo branch after building"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  build-sdk:
    name: Build SDK artifacts
    uses: ./.github/workflows/_build-sdk.yml
    with:
      upload_artifact: true

  build-aar:
    name: Build both Android AARs
    needs: [build-sdk]
    uses: ./.github/workflows/_build-android-aar.yml
    with:
      upload_artifact: true

  publish-maven-branch:
    name: Publish AARs to maven-repo branch
    needs: [build-aar]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # push the maven-repo branch
    concurrency:
      group: publish-maven-repo # never push the branch from two runs at once
      cancel-in-progress: false
    env:
      GROUP_ID: ${{ inputs.group_id }}
      VERSION: ${{ inputs.version != '' && inputs.version || format('0.8.0-v.{0}', github.run_number) }}
      BRANCH: maven-repo
    steps:
      - name: Download default AAR
        uses: actions/download-artifact@v8
        with:
          name: android-aar
          path: aars

      - name: Download CPU-only AAR
        uses: actions/download-artifact@v8
        with:
          name: android-aar-cpu
          path: aars

      # Check out (or create) the maven-repo branch into ./repo.
      - name: Prepare maven-repo branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BRANCH" "$url" repo
          else
            mkdir repo && cd repo
            git init -q -b "$BRANCH"
            git remote add origin "$url"
            printf '# Maven repository\n\nGenerated by the "Build and Publish Android AARs" workflow. Do not edit by hand.\n' > README.md
          fi

      - name: Write Maven layout
        shell: bash
        run: |
          set -euo pipefail
          group_path="${GROUP_ID//./\/}"

          write_artifact() {  # <aar file> <artifactId>
            local aar="$1" aid="$2"
            local dir="repo/${group_path}/${aid}/${VERSION}"
            local base="${aid}-${VERSION}"
            [ -f "$aar" ] || { echo "::error::missing $aar"; exit 1; }
            if [ -e "${dir}/${base}.aar" ]; then
              echo "::error::${GROUP_ID}:${aid}:${VERSION} already exists on ${BRANCH}; use a new version"; exit 1
            fi
            mkdir -p "$dir"
            cp "$aar" "${dir}/${base}.aar"
            cat > "${dir}/${base}.pom" <<POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${GROUP_ID}</groupId>
            <artifactId>${aid}</artifactId>
            <version>${VERSION}</version>
            <packaging>aar</packaging>
            <name>${aid}</name>
            <description>GenieX Android AAR (Metacrafters fork)</description>
            <url>https://github.com/${GITHUB_REPOSITORY}</url>
          </project>
          POM
            for f in "${dir}/${base}.aar" "${dir}/${base}.pom"; do
              md5sum  "$f" | awk '{print $1}' > "${f}.md5"
              sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
            done
            echo "wrote ${GROUP_ID}:${aid}:${VERSION}"
          }

          ls -l aars
          write_artifact aars/geniex-android-aar.aar     geniex-android
          write_artifact aars/geniex-android-aar-cpu.aar geniex-android-cpu

      - name: Commit and push
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GROUP_ID}:geniex-android:${VERSION}"
          git push origin "HEAD:${BRANCH}"
          {
            echo "### Published ${VERSION}"
            echo
            echo "settings.gradle repository:"
            echo '```groovy'
            echo "maven {"
            echo "    url = uri(\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}\")"
            echo "    content { includeGroup \"${GROUP_ID}\" }"
            echo "}"
            echo '```'
            echo "dependency:"
            echo '```groovy'
            echo "implementation '${GROUP_ID}:geniex-android:${VERSION}'"
            echo "implementation '${GROUP_ID}:geniex-android-cpu:${VERSION}'  // CPU-only variant"
            echo '```'
            echo
            echo "Check: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/${GROUP_ID//./\/}/geniex-android/${VERSION}/geniex-android-${VERSION}.pom"
          } >> "$GITHUB_STEP_SUMMARY"
